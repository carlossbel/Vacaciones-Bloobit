<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Bloobit</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%231b3a5c'/><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Georgia, serif' font-weight='700' font-size='40' fill='white'>B</text></svg>" />
    <script>
      // Aplicar tema y color guardados ANTES de que React monte,
      // para evitar un flash del color por defecto en la primera pintada.
      (function () {
        try {
          var mode = localStorage.getItem('kv-theme');
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
          var accent = localStorage.getItem('kv-accent');
          if (['navy','emerald','burgundy','violet','amber','graphite'].indexOf(accent) >= 0) {
            document.documentElement.setAttribute('data-accent', accent);
          }
        } catch (e) { /* sin localStorage, usar defaults */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
